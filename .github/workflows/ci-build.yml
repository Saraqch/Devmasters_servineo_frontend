name: CI Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build on Node 18
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Print environment info
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "PWD: $(pwd)"
          echo "Listing project files:"
          ls -la

      - name: Build
        run: npm run build
